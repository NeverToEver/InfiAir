name: Release

# 手动触发的发布工作流（CD）：构建 Linux/Windows 双平台包并创建 GitHub Release。
# 用法：Actions → Release → Run workflow → 输入版本号（如 3.27）。
# 版本号须与 `release.sh` VERSION 及 `project.godot` config/version 一致（工作流会自动同步 project.godot）。
# 依赖：官方 Godot 4.6.2 stable mono（.NET 版）+ mono 导出模板 + .NET 8 SDK；无第三方 action
# （2026-08-07 C# 立项：引擎/模板换 mono 版，导出前 dotnet build 嵌入 C# 程序集）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (MAJOR.MINOR, e.g. 3.27)'
        required: true
        type: string
        default: '3.27'

permissions:
  contents: write

jobs:
  release:
    name: Build v${{ github.event.inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK 8
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          dotnet --version

      - name: Install Godot 4.6.2 mono (editor)
        run: |
          # 2026-08-07：官方镜像 downloads.godotengine.org（GitHub Releases 直连在 runner 上不可靠）；
          # mono zip 为子目录结构，GodotSharp 运行时须与可执行文件同目录（软链经 readlink 解析）
          curl -sL --retry 3 --retry-delay 2 -o godot.zip \
            "https://downloads.godotengine.org/?version=4.6.2&flavor=stable&slug=mono_linux_x86_64.zip&platform=linux.64"
          unzip -q godot.zip
          sudo mkdir -p /opt/godot-mono
          sudo mv Godot_v4.6.2-stable_mono_linux_x86_64 /opt/godot-mono/4.6.2
          sudo ln -sf /opt/godot-mono/4.6.2/Godot_v4.6.2-stable_mono_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install mono export templates
        run: |
          curl -sL --retry 3 --retry-delay 2 -o templates.tpz \
            "https://downloads.godotengine.org/?version=4.6.2&flavor=stable&slug=mono_export_templates.tpz&platform=linux.x86_64"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d /tmp/et
          mv /tmp/et/templates ~/.local/share/godot/export_templates/4.6.2.stable.mono
          ls ~/.local/share/godot/export_templates/4.6.2.stable.mono/ | head -5

      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid version '$VERSION' (expect MAJOR.MINOR, e.g. 3.27)"
            exit 1
          fi
          # P4（2026-08-05）：重复触发同版本友好失败（原 git tag 已存在时裸失败无上下文）
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists on origin; pick a new version"
            exit 1
          fi
        env:
          VERSION: ${{ github.event.inputs.version }}

      - name: Sync project.godot config/version
        run: |
          sed -i.bak 's/^config\/version=.*/config\/version="'"$VERSION"'"/' project.godot
          rm -f project.godot.bak
          grep -n 'config/version' project.godot
          # P4（2026-08-05）：同步提交同时推 main——原实现只上 tag 不上 main，
          # 主分支 config/version 永久滞后于最新发布版本（L18 旧注释已随 R07 清理）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add project.godot
          git commit -m "chore: sync config/version to v$VERSION [skip ci]"
          git push origin HEAD:main
        env:
          VERSION: ${{ github.event.inputs.version }}

      - name: Build C# assemblies (embed into export)
        run: |
          dotnet build --nologo

      - name: Smoke test
        run: |
          godot --headless --import --path . > /tmp/import.log 2>&1 \
            || { echo "::error::import failed"; tail -30 /tmp/import.log; exit 1; }
          godot --headless --path . --quit-after 300 > /tmp/smoke.log 2>&1 \
            || { echo "::error::main scene smoke failed"; tail -30 /tmp/smoke.log; exit 1; }
          godot --headless --path . res://test/smoke_test.tscn > /tmp/smoke_test.log 2>&1 \
            || { echo "::error::smoke_test failed"; tail -30 /tmp/smoke_test.log; exit 1; }
          tail -2 /tmp/smoke_test.log

      - name: Build release packages
        run: |
          GODOT="$(command -v godot)" VERSION="$VERSION" ./release.sh
        env:
          VERSION: ${{ github.event.inputs.version }}

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          tag="v$VERSION"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" \
            builds/release/InfiAir-"$VERSION"-linux-x86_64.tar.gz \
            builds/release/InfiAir-"$VERSION"-windows-x86_64.zip \
            --title "InfiAir v$VERSION" \
            --notes "InfiAir v$VERSION 发布包（Linux / Windows，x86_64）。安装/卸载脚本见包内 packaging/；完整变更见 CHANGELOG.md 与 GitHub Releases 自动生成说明。"
