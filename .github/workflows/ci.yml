name: CI

# InfiAir 持续集成：无头导入 → 主场景冒烟 → 45 断言场景全量回归。
# 引擎使用官方 Godot 4.6.2 stable headless（Linux x86_64）二进制，不依赖第三方 action（仅官方 checkout）。
# 本地等价验证：`godot --headless --import --path .` + 逐个 `godot --headless --path . res://test/<场景>.tscn`

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Headless tests (Godot 4.6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.6.2 (headless)
        run: |
          curl -sL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.2-stable_linux.x86_64
          sudo mv Godot_v4.6.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: GDScript lint (gdlint)
        run: |
          python3 -m pip install --quiet gdtoolkit
          # test/ 纳入门禁（2026-08-03 L 系列盲区修复）：gdformat + gdlint 全量覆盖
          gdlint autoload/ scripts/ test/
          gdformat --check autoload/ scripts/ test/

      - name: Import project resources (warning gate)
        run: |
          godot --headless --import --path . > /tmp/import.log 2>&1 \
            || { echo "::error::import failed"; tail -30 /tmp/import.log; exit 1; }
          # GDScript 警告门禁：project.godot 配置的高价值警告为 error 级，
          # 任何 "Warning treated as error" 即失败（引擎级暗病排查）
          if grep -q "Warning treated as error" /tmp/import.log; then
            echo "::error::GDScript warnings (treated as errors) found:"
            grep -B1 "Warning treated as error" /tmp/import.log | head -30
            exit 1
          fi
          tail -3 /tmp/import.log

      - name: Main scene smoke (300 frames)
        run: |
          godot --headless --path . --quit-after 300 > /tmp/smoke.log 2>&1 \
            || { echo "::error::main scene smoke failed"; tail -30 /tmp/smoke.log; exit 1; }
          tail -3 /tmp/smoke.log

      - name: Compile probe all test scenes (gate blind spot)
        run: |
          # test/ 场景不被主场景引用，--import 不解析其脚本——L01a（截图工具链式
          # 调用编译错误）与 L01b（autoplay 状态表漂移）曾因此长期潜伏。
          # --quit-after 2 逐场景编译探针：Parse/Compile/SCRIPT ERROR 即失败；
          # timeout 60 兜底编译错误场景的静默挂起（AGENTS 已知 gotcha）。
          bad=0
          for tscn in test/*.tscn; do
            name="$(basename "$tscn" .tscn)"
            log="/tmp/probe-$name.log"
            timeout 60 godot --headless --path . "res://$tscn" --quit-after 2 >"$log" 2>&1
            code=$?
            if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
              echo "::error::$name compile probe failed (exit $code)"
              tail -20 "$log"
              bad=1
            elif grep -q "SCRIPT ERROR\|Parse Error\|Compile Error" "$log"; then
              echo "::error::$name compile probe SCRIPT ERROR"
              grep -B2 "SCRIPT ERROR\|Parse Error\|Compile Error" "$log" | head -20
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi
          echo "compile probe: $(ls test/*.tscn | wc -l) scenes clean"

      - name: Run assertion scenes (45)
        run: |
          passed=0
          failed=0
          for tscn in test/*_test.tscn; do
            name="$(basename "$tscn" .tscn)"
            case "$name" in
              autoplay_test) echo "skip $name (long-running probe, run locally)"; continue ;;
            esac
            echo "== $name =="
            log="/tmp/$name.log"
            # 单场景 5 分钟超时：防止单个场景挂起阻塞整个 job（30min 兜底之上）
            if timeout 300 godot --headless --path . "res://$tscn" >"$log" 2>&1; then
              passed=$((passed + 1))
            else
              code=$?
              echo "::error::$name FAILED (exit $code)"
              tail -25 "$log"
              failed=$((failed + 1))
            fi
          done
          echo "CI result: $passed passed, $failed failed"
          exit "$failed"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/*_test.log
          retention-days: 7
