name: CI

# InfiAir 持续集成（2026-08-29 W 系「削减」版本）。
# 2026-08-29：移除 full-regression（52 断言场景随场景删除而退役）、format 闸、
# zero-GDScript 闸（项目无 .gd，由 import 探针兜底）、compile probe、BALANCE_MAP 闸、
# dotnet/NuGet 缓存（安装成本低，YAML 优先简洁）；断言场景大幅退役后本地验证以
# smoke_test + base_system_test + xUnit 为主（见 docs/TESTING.md）。
# 政策口径保持：仅官方 checkout/upload-artifact/cache action + 官方 dotnet-install.sh
# + 官方 Godot 引擎/模板，禁止其他第三方依赖。

on:
  push:
    branches: [main, feature/*]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SDK_VERSION: "8.0"
  GODOT_VERSION: 4.6.2
  GODOT_CACHE_DIR: /tmp/godot-4.6.2

jobs:
  fast-gate:
    name: Fast gate (C# build/test + import + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK 8
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel "$DOTNET_SDK_VERSION" --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          dotnet --version

      - name: Build & test C# (warnings-as-errors + xUnit)
        run: |
          dotnet build --nologo
          dotnet test tests-csharp/ --nologo

      - name: Cache Godot mono engine
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_CACHE_DIR }}
          key: godot-mono-${{ env.GODOT_VERSION }}-${{ runner.os }}

      - name: Install Godot mono (headless, cached)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          # 官方镜像 downloads.godotengine.org（GitHub Releases 直连在 runner 上不可靠）；
          # mono zip 为子目录结构，GodotSharp 运行时须与可执行文件同目录（软链经 readlink 解析）。
          curl -sL --retry 3 --retry-delay 2 -o godot.zip \
            "https://downloads.godotengine.org/?version=$GODOT_VERSION&flavor=stable&slug=mono_linux_x86_64.zip&platform=linux.64"
          unzip -q godot.zip
          mkdir -p "$GODOT_CACHE_DIR"
          mv "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64" "$GODOT_CACHE_DIR/"
          sudo ln -sf "$GODOT_CACHE_DIR/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Link cached Godot binary
        if: steps.cache-godot.outputs.cache-hit == 'true'
        run: |
          sudo ln -sf "$GODOT_CACHE_DIR/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import project resources (warning gate)
        run: bash scripts/ci/check_import.sh /tmp/import.log

      - name: Main scene smoke (300 frames) + smoke_test
        run: |
          bash scripts/ci/check_smoke.sh /tmp/smoke.log
          godot --headless --path . res://test/smoke_test.tscn

      - name: Upload fast-gate failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-gate-logs
          path: |
            /tmp/import.log
            /tmp/smoke.log
          retention-days: 7
