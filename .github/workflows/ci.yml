name: CI

# InfiAir 持续集成（2026-08-09 Y 系列规整版，对齐业界成熟做法）。
# 设计目标（针对旧版痛点：feature push 也跑 45 分钟全量、每次重装引擎、同分支排队堆积）：
#   1. 分层门禁：fast-gate（~8 分钟：C# 门 + 零 GDScript + import + smoke + 编译探针）
#      覆盖全部 push/PR；full-regression（57 断言场景，~40 分钟）仅 main push / PR / 手动触发，
#      feature 分支开发期只吃快速反馈。
#   2. 路径过滤：docs/** 与 *.md 纯文档改动不触发 CI（业界惯例；BALANCE_MAP 生成物在 docs/
#      下，但代码改动会连带提交，full 闸仍兜底）。
#   3. 缓存：dotnet SDK / NuGet 包 / Godot mono 引擎均经 actions/cache（官方 action）缓存，
#      后续运行免下载安装。
#   4. concurrency：同分支新推送取消旧运行（full 45 分钟不排队堆积）。
# 政策口径保持：仅官方 checkout/upload-artifact/download-artifact/cache action +
# 官方 dotnet-install.sh 脚本 + 官方 Godot 引擎/模板，禁止其他第三方依赖。
# 注意（2026-08-10 修复）：GODOT_CACHE_DIR 须放 job 级 env 且用字面路径——runner.temp 在
# 工作流级/job 级 env 上下文不可用（仅 github/inputs/secrets/vars 等），曾致 workflow 解析
# 失败（run 0 jobs、0s 失败）；job 级 env 的 ${{ }} 表达式同样受限，故用 /tmp 字面路径。

on:
  push:
    branches: [main, feature/*]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SDK_VERSION: "8.0"
  GODOT_VERSION: 4.6.2

jobs:
  fast-gate:
    name: Fast gate (C# + import + smoke + compile probe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_CACHE_DIR: /tmp/godot-4.6.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache .NET SDK
        id: cache-dotnet
        uses: actions/cache@v4
        with:
          path: $HOME/.dotnet
          key: dotnet-sdk-${{ env.DOTNET_SDK_VERSION }}-${{ runner.os }}

      - name: Install .NET SDK 8
        if: steps.cache-dotnet.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel "$DOTNET_SDK_VERSION" --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          dotnet --version

      - name: Cache NuGet packages
        id: cache-nuget
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}

      - name: Build & test C# (warnings-as-errors + xUnit)
        run: |
          dotnet build --nologo
          dotnet test tests-csharp/ --nologo

      - name: C# format gate (dotnet format zero-diff)
        run: |
          # 2026-08-09：全量规范化（dotnet format 三工程）后加防回归闸——任何未过格式的
          # .cs 即失败。根 InfiAir.csproj 显式排除 csharp/core 与 tests-csharp，须三工程
          # 分别 verify（--no-restore 复用上一步 build 产物）
          # 2026-08-12：InfiAir.sln 入库后裸 `dotnet format` 报 "Both a MSBuild project file
          # and solution file found"——首工程必须显式指定 InfiAir.csproj
          dotnet format InfiAir.csproj --verify-no-changes --no-restore
          dotnet format csharp/core/InfiAir.Core.csproj --verify-no-changes --no-restore
          dotnet format tests-csharp/InfiAir.Core.Tests.csproj --verify-no-changes --no-restore

      - name: Cache Godot mono engine
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_CACHE_DIR }}
          key: godot-mono-${{ env.GODOT_VERSION }}-${{ runner.os }}

      - name: Install Godot 4.6.2 mono (headless, cached)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          # 2026-08-07：官方镜像 downloads.godotengine.org（GitHub Releases 直连在 runner 上
          # 不可靠——39s 失败实测）；mono zip 为子目录结构，GodotSharp 运行时须与可执行文件
          # 同目录（软链经 readlink 解析到真实位置，本地已验证）。缓存命中时跳过下载。
          curl -sL --retry 3 --retry-delay 2 -o godot.zip \
            "https://downloads.godotengine.org/?version=$GODOT_VERSION&flavor=stable&slug=mono_linux_x86_64.zip&platform=linux.64"
          unzip -q godot.zip
          mkdir -p "$GODOT_CACHE_DIR"
          mv Godot_v4.6.2-stable_mono_linux_x86_64 "$GODOT_CACHE_DIR/"
          sudo ln -sf "$GODOT_CACHE_DIR/Godot_v4.6.2-stable_mono_linux_x86_64/Godot_v4.6.2-stable_mono_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Link cached Godot binary
        if: steps.cache-godot.outputs.cache-hit == 'true'
        run: |
          sudo ln -sf "$GODOT_CACHE_DIR/Godot_v4.6.2-stable_mono_linux_x86_64/Godot_v4.6.2-stable_mono_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Zero-GDScript gate (M7d)
        run: |
          # M7 全量迁移 C# 后 autoload/scripts/test 已无 .gd；门禁从 gdformat/gdlint 改为
          # 零 GDScript 验收——任何新增 .gd 文件即失败（回归 GDScript 复活）
          leftover=$(find . -name "*.gd" -not -path "./.godot/*" -not -path "./builds/*" | wc -l)
          echo "remaining .gd files: $leftover"
          if [ "$leftover" -ne 0 ]; then
            echo "::error::zero-GDScript gate failed — .gd 文件残留（全量迁移 C# 后禁止新增）:"
            find . -name "*.gd" -not -path "./.godot/*" -not -path "./builds/*"
            exit 1
          fi

      - name: Import project resources (warning gate)
        run: |
          godot --headless --import --path . > /tmp/import.log 2>&1 \
            || { echo "::error::import failed"; tail -30 /tmp/import.log; exit 1; }
          # GDScript 警告门禁：project.godot 配置的高价值警告为 error 级，
          # 任何 "Warning treated as error" 即失败（引擎级暗病排查）
          if grep -q "Warning treated as error" /tmp/import.log; then
            echo "::error::GDScript warnings (treated as errors) found:"
            grep -B1 "Warning treated as error" /tmp/import.log | head -30
            exit 1
          fi
          tail -3 /tmp/import.log

      - name: Main scene smoke (300 frames)
        run: |
          godot --headless --path . --quit-after 300 > /tmp/smoke.log 2>&1 \
            || { echo "::error::main scene smoke failed"; tail -30 /tmp/smoke.log; exit 1; }
          # W 系列（2026-08-09）：与断言场景同口径——退出码 0 但日志含引擎/C# 错误即失败
          if grep -q "SCRIPT ERROR\|Parse Error\|Compile Error\|Nonexistent function\|Unhandled exception" /tmp/smoke.log; then
            echo "::error::main scene smoke engine errors in log"
            grep -B1 "SCRIPT ERROR\|Parse Error\|Compile Error\|Nonexistent function\|Unhandled exception" /tmp/smoke.log | head -10
            exit 1
          fi
          tail -3 /tmp/smoke.log

      - name: Compile probe all test scenes (gate blind spot)
        run: |
          # test/ 场景不被主场景引用，--import 不解析其脚本——L01a（截图工具链式
          # 调用编译错误）与 L01b（autoplay 状态表漂移）曾因此长期潜伏。
          # --quit-after 2 逐场景编译探针：Parse/Compile/SCRIPT ERROR/Nonexistent function/
          # Unhandled exception（C# 未处理异常——Godot 4 默认不终止应用，W 系列补）即失败；
          # timeout 60 兜底编译错误场景的静默挂起（AGENTS 已知 gotcha）。
          # Q26（2026-08-05）：probe 裸命令改包进 if 条件——GH Actions bash -e 下
          # 裸 timeout 非零（含 124 挂起）直接中止步骤，原 ::error:: 诊断与日志 tail
          # 全是死代码；且 124 本地放行/CI 失败语义相反。现在失败打印诊断、124 统一按失败。
          bad=0
          for tscn in test/*.tscn; do
            name="$(basename "$tscn" .tscn)"
            log="/tmp/probe-$name.log"
            if timeout 60 godot --headless --path . "res://$tscn" --quit-after 2 >"$log" 2>&1; then
              :
            else
              code=$?
              if [ "$code" -eq 124 ]; then
                echo "::error::$name compile probe timed out (hang)"
              else
                echo "::error::$name compile probe failed (exit $code)"
              fi
              tail -20 "$log"
              bad=1
              continue
            fi
            if grep -q "SCRIPT ERROR\|Parse Error\|Compile Error\|Nonexistent function\|Unhandled exception" "$log"; then
              echo "::error::$name compile probe engine error"
              grep -B2 "SCRIPT ERROR\|Parse Error\|Compile Error\|Nonexistent function\|Unhandled exception" "$log" | head -20
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi
          echo "compile probe: $(ls test/*.tscn | wc -l) scenes clean"

      - name: Upload fast-gate failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-gate-logs
          path: |
            /tmp/import.log
            /tmp/smoke.log
            /tmp/probe-*.log
          retention-days: 7

  full-regression:
    name: Full assertion scenes (57)
    needs: fast-gate
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_CACHE_DIR: /tmp/godot-4.6.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache .NET SDK
        id: cache-dotnet
        uses: actions/cache@v4
        with:
          path: $HOME/.dotnet
          key: dotnet-sdk-${{ env.DOTNET_SDK_VERSION }}-${{ runner.os }}

      - name: Install .NET SDK 8
        if: steps.cache-dotnet.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel "$DOTNET_SDK_VERSION" --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          dotnet --version

      - name: Cache NuGet packages
        id: cache-nuget
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}

      - name: Build C# (warnings-as-errors)
        run: dotnet build --nologo

      - name: Cache Godot mono engine
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_CACHE_DIR }}
          key: godot-mono-${{ env.GODOT_VERSION }}-${{ runner.os }}

      - name: Install Godot 4.6.2 mono (headless, cached)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          curl -sL --retry 3 --retry-delay 2 -o godot.zip \
            "https://downloads.godotengine.org/?version=$GODOT_VERSION&flavor=stable&slug=mono_linux_x86_64.zip&platform=linux.64"
          unzip -q godot.zip
          mkdir -p "$GODOT_CACHE_DIR"
          mv Godot_v4.6.2-stable_mono_linux_x86_64 "$GODOT_CACHE_DIR/"
          sudo ln -sf "$GODOT_CACHE_DIR/Godot_v4.6.2-stable_mono_linux_x86_64/Godot_v4.6.2-stable_mono_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Link cached Godot binary
        if: steps.cache-godot.outputs.cache-hit == 'true'
        run: |
          sudo ln -sf "$GODOT_CACHE_DIR/Godot_v4.6.2-stable_mono_linux_x86_64/Godot_v4.6.2-stable_mono_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import project resources
        run: godot --headless --import --path . > /tmp/import.log 2>&1 || { tail -30 /tmp/import.log; exit 1; }

      - name: Balance map generator zero-diff gate (M8)
        run: |
          # 2026-08-06 审计 M8：docs/BALANCE_MAP.md 由生成器扫描 cfg() 调用点产出
          # （含行号），改码后未重跑生成器 → 行号漂移累积（E10/K18/L10/Q08/R15 六次复发，
          # 根因「改码后重跑生成器」靠人记）；生成器重跑零 diff 闸从流程上堵死
          python3 scripts/tools/gen_balance_map.py
          if ! git diff --exit-code -- docs/BALANCE_MAP.md; then
            echo "::error::docs/BALANCE_MAP.md 过期——修改 cfg() 调用后须运行 python3 scripts/tools/gen_balance_map.py 并提交生成物"
            git diff -- docs/BALANCE_MAP.md | head -40
            exit 1
          fi

      - name: Run assertion scenes
        run: |
          passed=0
          failed=0
          flakes=0
          run=0
          total=$(ls test/*_test.tscn | wc -l)
          for tscn in test/*_test.tscn; do
            name="$(basename "$tscn" .tscn)"
            case "$name" in
              autoplay_test) echo "skip $name (long-running probe, run locally)"; continue ;;
            esac
            run=$((run + 1))
            echo "== $name =="
            log="/tmp/$name.log"
            # 单场景 5 分钟超时：防止单个场景挂起阻塞整个 job（45min 兜底之上）
            oklog="$log"
            if timeout 300 godot --headless --path . "res://$tscn" >"$log" 2>&1; then
              passed=$((passed + 1))
            else
              code=$?
              # 2026-08-07：flake 重试一次（parry_test 等 HUD 时序类偶发——本地重跑通过、
              # CI 负载下偶发）；重试仍要求最终通过，连续两次失败才计入 failed，不掩盖真实回归
              echo "::warning::$name failed once (exit $code), retrying once for possible flake"
              if timeout 300 godot --headless --path . "res://$tscn" >"$log.retry" 2>&1; then
                echo "::warning::$name passed on retry (flaky)"
                passed=$((passed + 1))
                flakes=$((flakes + 1))
                oklog="$log.retry"
              else
                code=$?
                echo "::error::$name FAILED twice (exit $code)"
                tail -25 "$log.retry"
                failed=$((failed + 1))
                continue
              fi
            fi
            # V 系列（2026-08-09）：引擎错误日志扫描——退出码 0 但日志含 SCRIPT ERROR/
            # Parse Error/Compile Error/Nonexistent function/Unhandled exception 即失败
            # （死测试/伪断言曾静默通过，CSharpCallTest 调已删方法每轮 CI 打引擎错误；
            # W 系列补 Unhandled exception——零 GDScript 后 C# 未处理异常为主盲区；与 compile probe 同口径）
            if grep -q "SCRIPT ERROR\|Parse Error\|Compile Error\|Nonexistent function\|Unhandled exception" "$oklog"; then
              echo "::error::$name passed exit 0 but engine errors in log"
              grep -B1 "SCRIPT ERROR\|Parse Error\|Compile Error\|Nonexistent function\|Unhandled exception" "$oklog" | head -10
              failed=$((failed + 1))
            fi
          done
          # V 系列（2026-08-09）：场景数一致性校验——run != 发现数-1（autoplay 跳过）即失败。
          # W 系列（2026-08-09）口径修正：total 与循环同 glob 同源，改名/新增本就被 glob 自动纳入，
          # 实际防御循环内跳过场景与 glob 空匹配（期望计数不硬编码，遵守 TESTING.md 权威计数）
          if [ "$run" -ne "$((total - 1))" ]; then
            echo "::error::assertion scene count mismatch — ran $run, discovered $((total - 1)) (autoplay_test skipped)"
            failed=$((failed + 1))
          fi
          echo "CI result: $passed passed, $failed failed, $flakes flaky (of $((total - 1)) scenes)"
          exit "$failed"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            /tmp/*_test.log
            /tmp/*_test.log.retry
            /tmp/probe-*.log
          retention-days: 7
