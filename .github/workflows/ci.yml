name: CI

# InfiAir 持续集成（fast-gate）。
# 引擎耦合行为测试（断言/截图场景）已退役；当前保留的 xUnit 工程只测
# csharp/core 纯逻辑层（零 Godot 依赖，决策见 ROADMAP Decisions），不入主 sln。
# 门禁链：
# 源码注释无日期戳 → 注释语种与术语 → 玩家可见文案无开发措辞 → 数值键存在性 → 存档写读对称性 → 设置写读对称性 → C# 构建零警告 → core 层单测 → 资源导入无警告 → 主场景 300 帧 + 设置页开页 + 编队遭遇全周期冒烟无错误。
# 政策口径保持：仅官方 checkout/upload-artifact/cache action + 官方 dotnet-install.sh
# + 官方 Godot 引擎/模板，禁止其他第三方依赖。

on:
  push:
    branches: [main, feature/*]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SDK_VERSION: "8.0"
  GODOT_VERSION: 4.6.2
  GODOT_CACHE_DIR: /tmp/godot-4.6.2

jobs:
  fast-gate:
    name: Fast gate (C# build + import + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK 8
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel "$DOTNET_SDK_VERSION" --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          dotnet --version

      - name: Comment date-stamp gate
        run: bash scripts/ci/check_comment_stamps.sh

      - name: Language style gate
        run: bash scripts/ci/check_language_style.sh

      - name: Player-facing copy gate
        run: bash scripts/ci/check_ui_copy.sh

      - name: Balance keys gate
        run: bash scripts/ci/check_balance_keys.sh

      - name: Save symmetry gate
        run: bash scripts/ci/check_save_symmetry.sh

      - name: Settings symmetry gate
        run: bash scripts/ci/check_settings_symmetry.sh

      - name: Build C# (warnings-as-errors)
        run: dotnet build --nologo

      - name: Core unit tests
        run: bash scripts/ci/check_unit_tests.sh

      - name: Cache Godot mono engine
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_CACHE_DIR }}
          key: godot-mono-${{ env.GODOT_VERSION }}-${{ runner.os }}

      - name: Install Godot mono (headless, cached)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          # 官方镜像 downloads.godotengine.org（GitHub Releases 直连在 runner 上不可靠）；
          # mono zip 为子目录结构，GodotSharp 运行时须与可执行文件同目录（软链经 readlink 解析）。
          curl -sL --retry 3 --retry-delay 2 -o godot.zip \
            "https://downloads.godotengine.org/?version=$GODOT_VERSION&flavor=stable&slug=mono_linux_x86_64.zip&platform=linux.64"
          unzip -q godot.zip
          mkdir -p "$GODOT_CACHE_DIR"
          mv "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64" "$GODOT_CACHE_DIR/"
          sudo ln -sf "$GODOT_CACHE_DIR/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Link cached Godot binary
        if: steps.cache-godot.outputs.cache-hit == 'true'
        run: |
          sudo ln -sf "$GODOT_CACHE_DIR/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import project resources (warning gate)
        run: bash scripts/ci/check_import.sh /tmp/import.log

      - name: Main scene smoke (300 frames)
        run: bash scripts/ci/check_smoke.sh /tmp/smoke.log

      - name: Upload fast-gate failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-gate-logs
          path: |
            /tmp/import.log
            /tmp/smoke.log
            /tmp/smoke.settings.log
            /tmp/smoke.formation.log
          retention-days: 7
